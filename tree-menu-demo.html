<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>湖南炎陵运维中心 · 小水电集控</title>
<style>
:root {
  --bg: #0a1628;
  --bg2: #0d1b2a;
  --bg3: #111d2f;
  --card: rgba(255,255,255,0.02);
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.04);
  --t: #e8eaed;
  --t2: #9aa0a6;
  --t3: #5f6368;
  --accent: #1e90ff;
  --accent2: #00b4d8;
  --green: #4caf50;
  --orange: #ff9800;
  --red: #f44336;
  --ff: 'Noto Sans SC','Microsoft YaHei',sans-serif;
  --fd: 'Rajdhani','Courier New',monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--t);
  font-family: var(--ff);
  font-size: 13px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 20px;
}

/* ===== Tree Panel ===== */
.tree-panel {
  width: 360px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
}

/* Header */
.tree-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: linear-gradient(180deg, rgba(30,144,255,0.06) 0%, transparent 100%);
  border-bottom: 1px solid var(--border);
}
.tree-header .title {
  font-size: 15px;
  font-weight: 600;
  color: var(--t);
  letter-spacing: 0.5px;
}
.tree-header .title .dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  margin-right: 8px;
  box-shadow: 0 0 8px rgba(30,144,255,0.5);
}
.tree-header .collapse-btn {
  width: 28px;
  height: 28px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.03);
  color: var(--t2);
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.tree-header .collapse-btn:hover {
  background: rgba(255,255,255,0.06);
  color: var(--t);
}

/* Search */
.tree-search {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border2);
}
.tree-search input {
  width: 100%;
  padding: 8px 12px 8px 34px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--t);
  font-size: 12px;
  font-family: var(--ff);
  outline: none;
  transition: border-color 0.2s;
}
.tree-search input::placeholder { color: var(--t3); }
.tree-search input:focus { border-color: var(--accent); }
.tree-search .search-icon {
  position: absolute;
  margin: 10px 0 0 12px;
  color: var(--t3);
  font-size: 13px;
  pointer-events: none;
}
.tree-search { position: relative; }

/* Tree body */
.tree-body {
  max-height: 520px;
  overflow-y: auto;
  padding: 4px 0;
}
.tree-body::-webkit-scrollbar { width: 4px; }
.tree-body::-webkit-scrollbar-track { background: transparent; }
.tree-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Tree node */
.tree-node { user-select: none; }
.tree-row {
  display: flex;
  align-items: center;
  padding: 9px 16px;
  cursor: pointer;
  color: var(--t2);
  font-size: 13px;
  transition: all 0.15s;
  gap: 8px;
  position: relative;
}
.tree-row:hover { background: rgba(255,255,255,0.025); color: var(--t); }

/* Level 0 (company) */
.tree-row.lv-0 {
  font-weight: 600;
  color: var(--t);
  font-size: 13px;
  padding: 10px 16px;
}
.tree-row.lv-0 .arrow { font-size: 9px; width: 16px; }

/* Level 1 (ops center) */
.tree-row.lv-1 { padding-left: 28px; font-weight: 500; color: #c8ccd0; }
.tree-row.lv-1 .arrow { font-size: 9px; width: 16px; }

/* Level 2 (station) */
.tree-row.lv-2 {
  padding-left: 44px;
  font-size: 13px;
  color: var(--t2);
}
.tree-row.lv-2::before {
  content: '';
  position: absolute;
  left: 36px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--t3);
  transition: all 0.2s;
}
.tree-row.lv-2:hover::before { background: var(--t2); }

/* Selected station */
.tree-row.lv-2.selected {
  color: var(--accent);
  font-weight: 500;
}
.tree-row.lv-2.selected::before {
  background: var(--accent);
  box-shadow: 0 0 6px rgba(30,144,255,0.6);
  width: 6px;
  height: 6px;
  left: 35.5px;
}

/* Arrow */
.tree-row .arrow {
  width: 16px;
  font-size: 8px;
  color: var(--t3);
  transition: transform 0.2s;
  flex-shrink: 0;
  text-align: center;
  line-height: 1;
}
.tree-row.open > .arrow { transform: rotate(90deg); }
.tree-row.leaf .arrow { visibility: hidden; }

/* Label */
.tree-row .label {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Badge */
.tree-row .badge {
  font-size: 10px;
  color: var(--t3);
  background: rgba(255,255,255,0.04);
  padding: 2px 7px;
  border-radius: 8px;
  flex-shrink: 0;
}

/* Children container */
.tree-children {
  overflow: hidden;
  transition: max-height 0.3s ease;
}
.tree-children:not(.open) { max-height: 0; }
.tree-children.open { max-height: 1200px; }

/* Highlight dot animation */
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 4px rgba(30,144,255,0.4); }
  50% { box-shadow: 0 0 10px rgba(30,144,255,0.8); }
}
.tree-row.lv-2.selected::before { animation: pulse 2s infinite; }

/* Collapsed panel */
.tree-panel.collapsed .tree-search,
.tree-panel.collapsed .tree-body { display: none; }
.tree-panel.collapsed { width: auto; }
.tree-panel.collapsed .tree-header { border-bottom: none; }

/* No results */
.no-results {
  padding: 24px;
  text-align: center;
  color: var(--t3);
  font-size: 12px;
}
</style>
</head>
<body>

<div class="tree-panel" id="treePanel">
  <!-- Header -->
  <div class="tree-header">
    <span class="title"><span class="dot"></span>湖南炎陵运维中心</span>
    <button class="collapse-btn" id="collapseBtn" title="收起侧边栏">◀</button>
  </div>

  <!-- Search -->
  <div class="tree-search">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="输入关键字进行搜索" oninput="filterTree()">
  </div>

  <!-- Tree -->
  <div class="tree-body" id="treeBody"></div>
</div>

<script>
// ===== TREE DATA =====
const treeData = {
  id: 'jt',
  name: '江河股份智能监控中心',
  children: [
    {
      id: 'yl',
      name: '湖南炎陵运维中心',
      children: [
        { id: 's01', name: '炎陵进江源水电站' },
        { id: 's02', name: '炎陵梨木坳水电站' },
        { id: 's03', name: '炎陵龙泉水电站', selected: true },
        { id: 's04', name: '炎陵龙江水电站' },
        { id: 's05', name: '炎陵岗青山水电站' },
        { id: 's06', name: '炎陵沔渡水电站' },
        { id: 's07', name: '炎陵银新水电站' },
        { id: 's08', name: '炎陵铁钩水电站' },
        { id: 's09', name: '炎陵金钩湾水电站' },
        { id: 's10', name: '炎陵土坔水电站' },
        { id: 's11', name: '炎陵青龙水电站' }
      ]
    }
  ]
};

// ===== BUILD TREE =====
let activeStationId = 's03'; // 默认选中龙泉水电站

function buildTree(data, container) {
  container.innerHTML = '';

  // L0: 公司
  const rootDiv = document.createElement('div');
  rootDiv.className = 'tree-node';

  const rootRow = document.createElement('div');
  rootRow.className = 'tree-row lv-0 open';
  rootRow.innerHTML = '<span class="arrow">▶</span><span class="label">' + esc(data.name) + '</span>';
  rootRow.onclick = function(e) {
    e.stopPropagation();
    this.classList.toggle('open');
    const children = this.parentElement.querySelector(':scope > .tree-children');
    if (children) children.classList.toggle('open');
  };
  rootDiv.appendChild(rootRow);

  // L1 children (ops centers)
  const rootChildren = document.createElement('div');
  rootChildren.className = 'tree-children open';

  (data.children || []).forEach(function(center) {
    const centerNode = document.createElement('div');
    centerNode.className = 'tree-node';

    const centerRow = document.createElement('div');
    centerRow.className = 'tree-row lv-1 open';
    centerRow.innerHTML = '<span class="arrow">▶</span><span class="label">' + esc(center.name) + '</span><span class="badge">' + (center.children||[]).length + ' 站</span>';
    centerRow.onclick = function(e) {
      e.stopPropagation();
      this.classList.toggle('open');
      const cd = this.parentElement.querySelector(':scope > .tree-children');
      if (cd) cd.classList.toggle('open');
    };
    centerNode.appendChild(centerRow);

    // L2 stations
    const centerChildren = document.createElement('div');
    centerChildren.className = 'tree-children open';

    (center.children || []).forEach(function(station) {
      const stRow = document.createElement('div');
      stRow.className = 'tree-row lv-2 leaf' + (station.selected ? ' selected' : '');
      stRow.setAttribute('data-id', station.id);
      stRow.innerHTML = '<span class="arrow">▶</span><span class="label">' + esc(station.name) + '</span>';
      stRow.onclick = function(e) {
        e.stopPropagation();
        selectStation(station.id);
      };
      centerChildren.appendChild(stRow);
    });

    centerNode.appendChild(centerChildren);
    rootChildren.appendChild(centerNode);
  });

  rootDiv.appendChild(rootChildren);
  container.appendChild(rootDiv);
}

function selectStation(id) {
  activeStationId = id;
  const treeBody = document.getElementById('treeBody');
  treeBody.querySelectorAll('.tree-row.lv-2').forEach(function(r) {
    r.classList.toggle('selected', r.getAttribute('data-id') === id);
  });
  // Update header title
  const selRow = treeBody.querySelector('.tree-row.lv-2.selected');
  if (selRow) {
    const name = selRow.querySelector('.label').textContent;
    document.querySelector('.tree-header .title').innerHTML = '<span class="dot"></span>' + esc(name);
  }
}

// ===== SEARCH FILTER =====
function filterTree() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const rows = document.getElementById('treeBody').querySelectorAll('.tree-row');
  const nodes = document.getElementById('treeBody').querySelectorAll('.tree-node');

  if (!q) {
    // Show all
    rows.forEach(function(r) { r.style.display = ''; });
    nodes.forEach(function(n) {
      const cr = n.querySelector(':scope > .tree-children');
      if (cr && cr.classList.contains('open')) cr.classList.add('open');
    });
    document.querySelectorAll('.no-results').forEach(function(el) { el.remove(); });
    return;
  }

  let hasResults = false;
  nodes.forEach(function(node) {
    let nodeHasMatch = false;
    const nodeRows = node.querySelectorAll('.tree-row');
    nodeRows.forEach(function(row) {
      const label = (row.querySelector('.label')?.textContent || '').toLowerCase();
      if (label.includes(q)) {
        row.style.display = '';
        nodeHasMatch = true;
        hasResults = true;
      } else if (row.classList.contains('lv-2')) {
        row.style.display = 'none';
      } else {
        row.style.display = '';
      }
    });
    // Expand if has match
    if (nodeHasMatch) {
      const cr = node.querySelector(':scope > .tree-children');
      if (cr) cr.classList.add('open');
      const parentRow = node.querySelector('.tree-row');
      if (parentRow) parentRow.classList.add('open');
    }
  });

  // Show/hide no-results
  const existing = document.querySelector('.no-results');
  if (!hasResults) {
    if (!existing) {
      const nr = document.createElement('div');
      nr.className = 'no-results';
      nr.textContent = '未找到匹配的水电站';
      document.getElementById('treeBody').appendChild(nr);
    }
  } else if (existing) {
    existing.remove();
  }
}

// ===== COLLAPSE =====
document.getElementById('collapseBtn').addEventListener('click', function() {
  const panel = document.getElementById('treePanel');
  panel.classList.toggle('collapsed');
  this.textContent = panel.classList.contains('collapsed') ? '▶' : '◀';
  this.title = panel.classList.contains('collapsed') ? '展开侧边栏' : '收起侧边栏';
});

// ===== HELPERS =====
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ===== INIT =====
buildTree(treeData, document.getElementById('treeBody'));
</script>
</body>
</html>
