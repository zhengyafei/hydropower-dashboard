<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小水电智能监控中心</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
	<style>
:root {
  --bg: #0a1628; --bg2: #0d1b2a; --bg3: #111d32; --card: rgba(10,22,40,0.85);
  --t: #e0e8f0; --t2: #8899b4; --t3: #5a6d84;
  --accent: #1e90ff; --accent2: #00b4d8; --accent3: #48cae4;
  --green: #00c853; --orange: #ff9100; --red: #ff1744; --yellow: #ffd600; --gray: #546e7a;
  --border: rgba(30,144,255,0.15); --border2: rgba(255,255,255,0.06);
  --fd: 'Rajdhani', 'Consolas', monospace; --ff: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --zone1: #1a3a5c; --zone2: #1a4a3c; --zone3: #3a2a5c; --zone4: #4a3a2c;
  --shadow: 0 2px 12px rgba(0,0,0,0.4);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--t); font-family:var(--ff); font-size:13px; display:flex; height:100vh; overflow:hidden; }
.sidebar { width:240px; min-width:240px; background:var(--bg2); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow-y:auto; }
.side-logo { padding:18px 16px; border-bottom:1px solid var(--border2); }
.side-logo h2 { font-size:20px; font-weight:700; letter-spacing:1px; }
.side-logo h2 span { color:var(--accent); }
.side-logo .sub { font-size:9px; color:var(--t3); letter-spacing:3px; margin-top:2px; text-transform:uppercase; }
.side-nav { flex:1; padding:8px 0; }
.ng { margin-bottom:2px; }
.ng.open > .nc { display:block; }
.nc { display:none; }
.ngh { display:flex; align-items:center; padding:10px 16px; cursor:pointer; color:var(--t2); font-size:13px; transition:all .2s; gap:8px; border-left:3px solid transparent; }
.ngh:hover { background:rgba(30,144,255,0.08); color:var(--t); }
.ngh.active { color:var(--accent); border-left-color:var(--accent); background:rgba(30,144,255,0.1); }
.ngh-sub { padding-left:44px !important; font-size:12px; color:var(--t3); }
.ngh-sub:hover { color:var(--t); }
.ngh .ic { font-size:15px; width:20px; text-align:center; }
.ngh .ar { font-size:10px; margin-left:auto; transition:transform .2s; }
.ng.open > .ngh .ar { transform:rotate(90deg); }
.nci { display:flex; align-items:center; padding:8px 16px 8px 44px; cursor:pointer; color:var(--t3); font-size:12px; transition:all .2s; border-left:3px solid transparent; }
.ng .nc .ng .nc .nci { padding-left:60px; font-size:11px; }
.nci:hover { color:var(--t); background:rgba(255,255,255,0.03); }
.nci.active { color:var(--accent2); border-left-color:var(--accent2); background:rgba(0,180,216,0.08); }
.nci .dot { width:5px; height:5px; border-radius:50%; background:var(--t3); margin-right:8px; flex-shrink:0; }
.nci.active .dot { background:var(--accent2); }
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.hdr { display:flex; align-items:center; padding:0 20px; height:48px; background:var(--bg2); border-bottom:1px solid var(--border2); gap:12px; flex-shrink:0; }
.hdr .ldot { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.hdr .sys { font-weight:600; font-size:15px; letter-spacing:1px; }
.hdr .sep { width:1px; height:20px; background:var(--border); }
.hdr .bc { color:var(--accent); font-size:12px; }
.hdr .sp { flex:1; }
.hdr .clk { font-family:var(--fd); font-size:13px; color:var(--t2); font-weight:500; }
.hdr .ub { display:flex; align-items:center; gap:6px; }
.hdr .ua { width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; }
.content { flex:1; overflow-y:auto; padding:16px; }
.kpi-row { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:16px; }
.kpi { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:14px 16px; text-align:center; backdrop-filter:blur(4px); }
.kpi .kl { font-size:11px; color:var(--t3); margin-bottom:4px; text-transform:uppercase; letter-spacing:2px; }
.kpi .kv { font-family:var(--fd); font-size:28px; font-weight:700; color:var(--t); }
.kpi .ks { font-size:10px; color:var(--t2); margin-top:2px; }
.kpi.good .kv { color:var(--green); }
.mgrid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
.mgrid.full { grid-template-columns:1fr; }
.mgrid.triple { grid-template-columns:1fr 1fr 1fr; }
.card { background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden; backdrop-filter:blur(4px); display:flex; flex-direction:column; }
.card-header { display:flex; align-items:center; padding:10px 14px; border-bottom:1px solid var(--border2); background:rgba(255,255,255,0.02); }
.card-header .ct { font-weight:600; font-size:13px; color:var(--accent); }
.card-header .cn { margin-left:auto; font-size:11px; color:var(--t3); }
.card-body { padding:8px; overflow:auto; flex:1; }
.tbl { width:100%; border-collapse:collapse; font-size:12px; }
.tbl thead { position:sticky; top:0; z-index:2; }
.tbl th { padding:8px 10px; text-align:left; font-weight:500; color:var(--t3); font-size:11px; background:var(--bg3); white-space:nowrap; border-bottom:2px solid var(--border); }
.tbl td { padding:7px 10px; border-bottom:1px solid var(--border2); color:var(--t); white-space:nowrap; }
.tbl tbody tr:hover { background:rgba(30,144,255,0.06); }
.tbl .date-col { font-family:var(--fd); color:var(--accent2); font-weight:500; }
.badge { display:inline-block; padding:2px 8px; border-radius:3px; font-size:10px; font-weight:500; }
.be { background:rgba(0,200,83,0.15); color:var(--green); }
.bp { background:rgba(255,145,0,0.15); color:var(--orange); }
.bo { background:rgba(84,110,122,0.15); color:var(--gray); }
.lv1 { background:rgba(255,23,68,0.2); color:var(--red); }
.lv2 { background:rgba(255,145,0,0.2); color:var(--orange); }
.lv3 { background:rgba(255,214,0,0.2); color:var(--yellow); }
.shift-tag { display:inline-block; padding:1px 6px; border-radius:2px; font-size:10px; font-weight:600; }
.s1 { background:rgba(30,144,255,0.2); color:var(--accent); }
.s2 { background:rgba(0,180,216,0.2); color:var(--accent2); }
.s3 { background:rgba(72,202,228,0.2); color:var(--accent3); }
.dlist { list-style:none; }
.ditem { padding:8px 10px; border-bottom:1px solid var(--border2); }
.ditem:last-child { border-bottom:none; }
.im .it { color:var(--t); font-size:12px; }
.im2 { color:var(--t3); font-size:10px; margin-top:2px; }
.ib { display:flex; gap:8px; }
.tags { display:flex; flex-wrap:wrap; gap:6px; }
.tag { padding:3px 10px; background:rgba(30,144,255,0.1); border:1px solid var(--border); border-radius:16px; font-size:11px; color:var(--t2); }
.tag em { font-style:normal; color:var(--accent); margin-left:4px; font-weight:600; }
.page-title { font-size:18px; font-weight:600; margin-bottom:4px; }
.page-sub { font-size:11px; color:var(--t3); margin-bottom:12px; }
.empty-state { text-align:center; padding:40px; color:var(--t3); }
.eicon { font-size:32px; margin-bottom:8px; }

/* Architecture Visualization */
.arch-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
.zone-card { border-radius:8px; padding:12px; border:1px solid; position:relative; }
.zone-card .znum { font-family:var(--fd); font-size:11px; font-weight:600; opacity:.6; }
.zone-card .ztitle { font-size:13px; font-weight:700; margin:4px 0 8px; }
.zone-card .zsvc { font-size:10px; color:var(--t3); line-height:1.6; }
.zone-card .zsvc b { color:var(--t2); }
.z1 { background:rgba(26,58,92,0.5); border-color:rgba(30,144,255,0.3); }
.z1 .znum,.z1 .ztitle { color:var(--accent); }
.z2 { background:rgba(26,74,60,0.5); border-color:rgba(0,200,83,0.3); }
.z2 .znum,.z2 .ztitle { color:var(--green); }
.z3 { background:rgba(58,42,92,0.5); border-color:rgba(156,39,176,0.3); }
.z3 .znum,.z3 .ztitle { color:#ce93d8; }
.z4 { background:rgba(74,58,44,0.5); border-color:rgba(255,145,0,0.3); }
.z4 .znum,.z4 .ztitle { color:var(--orange); }
.flow-arrow { display:flex; align-items:center; justify-content:center; gap:4px; grid-column:1/-1; padding:4px; color:var(--t3); font-size:10px; }
.flow-arrow .arr { color:var(--accent); font-size:16px; }

/* State Machine */
.sm-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.sm-state { padding:12px; border-radius:6px; border:1px solid; text-align:center; }
.sm-state .sml { font-size:11px; font-weight:700; margin-bottom:4px; }
.sm-state .smd { font-size:10px; color:var(--t3); }
.sm-active { border-color:var(--accent); background:rgba(30,144,255,0.1); }
.sm-active .sml { color:var(--accent); }
.sm-inactive { border-color:var(--border); background:rgba(255,255,255,0.02); }
.sm-inactive .sml { color:var(--t3); }
.sm-arrow { display:flex; align-items:center; justify-content:center; color:var(--t3); font-size:18px; }

/* Control Word */
.cw-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.cw-item { padding:10px; border-radius:4px; background:rgba(255,255,255,0.03); border:1px solid var(--border2); text-align:center; }
.cw-item .cwl { font-size:9px; color:var(--t3); text-transform:uppercase; letter-spacing:1px; }
.cw-item .cwv { font-family:var(--fd); font-size:14px; font-weight:600; margin-top:2px; }

/* Alarm Flow */
.alarm-flow { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:10px; padding:8px 0; }
.alarm-node { padding:4px 10px; border-radius:4px; background:var(--bg3); border:1px solid var(--border); white-space:nowrap; }
.alarm-node.highlight { border-color:var(--red); background:rgba(255,23,68,0.1); color:var(--red); }
.alarm-arr { color:var(--t3); font-size:14px; }

/* Terminology Table */
.term-tbl td:first-child { font-family:var(--fd); color:var(--accent); }

/* Section label */
.sec-label { font-size:10px; color:var(--t3); text-transform:uppercase; letter-spacing:2px; margin-bottom:8px; padding-left:2px; }

.tab-bar { display:flex; gap:0; margin-bottom:14px; border-bottom:2px solid var(--border); }
.tab-btn { padding:8px 20px; cursor:pointer; color:var(--t3); font-size:13px; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .2s; }
.tab-btn:hover { color:var(--t); }
.tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }
.tab-panel { display:block; }
.filter-bar { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; padding:12px 14px; background:rgba(255,255,255,0.02); border:1px solid var(--border2); border-radius:6px; margin-bottom:12px; }
.fitem { display:flex; flex-direction:column; gap:3px; }
.fitem label { font-size:10px; color:var(--t3); }
.finp { background:var(--bg3); border:1px solid var(--border); color:var(--t); padding:5px 8px; border-radius:3px; font-size:12px; font-family:var(--ff); min-width:120px; }
.finp:focus { outline:none; border-color:var(--accent); }
.fbtn { padding:5px 16px; background:var(--accent); color:#fff; border:1px solid var(--accent); border-radius:3px; cursor:pointer; font-size:12px; font-family:var(--ff); }
.fbtn:hover { opacity:.85; }

@media (max-width:1400px) {
  .arch-grid { grid-template-columns:repeat(2,1fr); }
  .kpi-row { grid-template-columns:repeat(3,1fr); }
  .mgrid { grid-template-columns:1fr; }
}
@media (max-width:1024px) {
  .sidebar { width:200px; min-width:200px; }
  .arch-grid { grid-template-columns:1fr; }
  .kpi-row { grid-template-columns:repeat(2,1fr); }
}

/* SCADA Scene Renderer */
.scene-wrap { position:relative; background:var(--bg3); border:1px solid var(--border); border-radius:4px; overflow:hidden; }
.scene-canvas { position:relative; transform-origin:0 0; }
.scene-node { position:absolute; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.scene-node.label { font-family:var(--ff); color:#ccc; white-space:nowrap; pointer-events:none; }
.scene-node.rect { border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.02); border-radius:2px; }
.scene-node.data { font-family:var(--fd); color:var(--accent2); font-size:13px; font-weight:600; background:rgba(0,0,0,0.3); border-radius:2px; }
.scene-node.button { background:rgba(30,144,255,0.15); border:1px solid rgba(30,144,255,0.4); border-radius:3px; color:#ccc; font-size:12px; cursor:pointer; font-family:var(--ff); transition:all .15s; }
.scene-node.button:hover { background:rgba(30,144,255,0.3); border-color:var(--accent); }
.scene-node.button.warn { background:rgba(255,23,68,0.15); border-color:rgba(255,23,68,0.4); }
.scene-node.button.warn:hover { background:rgba(255,23,68,0.3); border-color:var(--red); }
.scene-node.ellipse { border-radius:50%; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.03); }
.scene-node.ellipse.on { background:rgba(0,200,83,0.3); border-color:var(--green); box-shadow:0 0 6px rgba(0,200,83,0.3); }
.scene-node.bus { background:rgba(255,255,255,0.2); border-radius:1px; }
.scene-node.breaker { border-radius:4px; }
.scene-node.breaker.closed { background:rgba(0,200,83,0.2); border:1px solid var(--green); }
.scene-node.breaker.open { background:rgba(255,23,68,0.2); border:1px solid var(--red); }
.scene-node.port { border-radius:50%; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3); }
.scene-node.dynamo { border-radius:50%; background:rgba(30,144,255,0.1); border:2px solid var(--accent); }
.scene-node.triangle { width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:10px solid var(--accent); background:none; border-radius:0; }
.scene-node.changbian { border-radius:3px; }
.scene-node.daozha { border-radius:50%; }
.scene-node.bxdl { border-radius:2px; }
/* Smart Power Tab Bar */
.sp-tabs { display:flex; gap:2px; margin-bottom:10px; flex-wrap:wrap; }
.sp-tab { padding:6px 14px; cursor:pointer; color:var(--t3); font-size:12px; background:rgba(255,255,255,0.03); border:1px solid var(--border2); border-radius:4px 4px 0 0; transition:all .2s; }
.sp-tab:hover { color:var(--t); background:rgba(255,255,255,0.06); }
.sp-tab.active { color:var(--accent); background:rgba(30,144,255,0.1); border-color:var(--accent); border-bottom-color:transparent; }
.sp-tab-panel { display:none; }
.sp-tab-panel.active { display:block; }

/* Unit Control Dual-Column Panel */
.uc-global-bar { display:flex; align-items:center; gap:16px; padding:8px 14px; background:rgba(255,255,255,0.03); border:1px solid var(--border2); border-radius:6px; margin-bottom:10px; flex-wrap:wrap; font-size:12px; }
.uc-global-bar .uc-gb-left { display:flex; align-items:center; gap:12px; }
.uc-global-bar .uc-gb-mid { flex:1; text-align:center; min-width:200px; }
.uc-global-bar .uc-gb-right { display:flex; align-items:center; gap:12px; }
.uc-global-bar .uc-stat-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; }
.uc-global-bar .uc-stat-dot.green { background:#00e676; box-shadow:0 0 4px rgba(0,230,118,0.5); }
.uc-global-bar .uc-stat-dot.red { background:#ff1744; box-shadow:0 0 4px rgba(255,23,68,0.5); }
.uc-dual { display:flex; gap:10px; }
.uc-dual .uc-card { flex:1; background:#0d2137; border:1px solid #1e3a5f; border-radius:8px; overflow:hidden; min-width:0; }
.uc-card-header { display:flex; align-items:center; gap:10px; padding:10px 14px; background:rgba(30,136,229,0.08); border-bottom:1px solid rgba(30,136,229,0.2); flex-wrap:wrap; }
.uc-card-header .uc-name { font-size:15px; font-weight:700; color:#fff; }
.uc-card-header .uc-status-tag { padding:2px 10px; border-radius:10px; font-size:11px; font-weight:600; }
.uc-card-header .uc-status-tag.running { background:rgba(0,176,255,0.2); color:#00b0ff; border:1px solid rgba(0,176,255,0.4); }
.uc-card-header .uc-status-tag.standby { background:rgba(255,145,0,0.2); color:#ff9100; border:1px solid rgba(255,145,0,0.4); }
.uc-card-header .uc-status-tag.stopped { background:rgba(255,255,255,0.1); color:#999; border:1px solid rgba(255,255,255,0.2); }
.uc-card-header .uc-power { font-family:var(--fd); font-size:14px; color:var(--accent2); font-weight:600; }
.uc-card-header .uc-comms { display:flex; gap:8px; font-size:10px; align-items:center; margin-left:auto; }
.uc-card-header .uc-comms-item { display:flex; align-items:center; gap:3px; }
.uc-card-body { padding:10px 14px; display:flex; flex-direction:column; gap:8px; }
.uc-row { display:flex; gap:10px; }
.uc-col { flex:1; min-width:0; }
.uc-section { background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); border-radius:6px; padding:10px 12px; }
.uc-section h4 { font-size:12px; color:var(--accent); margin:0 0 8px 0; font-weight:600; display:flex; align-items:center; gap:8px; }
.uc-section h4 .uc-mode-tag { font-size:10px; padding:1px 8px; border-radius:8px; background:rgba(0,176,255,0.15); color:#00b0ff; border:1px solid rgba(0,176,255,0.35); font-weight:500; }
.uc-section h4 .uc-mode-tag.manual { background:rgba(255,145,0,0.15); color:#ff9100; border-color:rgba(255,145,0,0.35); }
.uc-kv { display:flex; justify-content:space-between; align-items:center; padding:2px 0; font-size:11px; border-bottom:1px solid rgba(255,255,255,0.03); }
.uc-kv .uc-k { color:var(--t3); }
.uc-kv .uc-v { font-family:var(--fd); color:#e0e0e0; font-weight:500; }
.uc-kv .uc-v.highlight { color:#00e5ff; font-weight:600; }
.uc-btn-row { display:flex; gap:4px; align-items:center; }
.uc-btn { padding:3px 10px; border:1px solid rgba(255,255,255,0.2); border-radius:4px; background:rgba(255,255,255,0.06); color:#ccc; font-size:11px; cursor:pointer; font-family:var(--ff); transition:all .15s; }
.uc-btn:hover { background:rgba(255,255,255,0.14); border-color:rgba(255,255,255,0.35); }
.uc-btn.accent { background:rgba(0,176,255,0.15); border-color:rgba(0,176,255,0.4); color:#00b0ff; }
.uc-btn.accent:hover { background:rgba(0,176,255,0.25); }
.uc-btn.danger { background:rgba(255,23,68,0.2); border-color:rgba(255,23,68,0.5); color:#ff1744; font-weight:700; font-size:13px; padding:6px 20px; }
.uc-btn.danger:hover { background:rgba(255,23,68,0.35); }
.uc-status-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:3px 6px; }
.uc-status-item { display:flex; align-items:center; gap:4px; font-size:10px; }
.uc-status-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.uc-status-dot.normal { background:#00e676; box-shadow:0 0 3px rgba(0,230,118,0.4); }
.uc-status-dot.warning { background:#ff1744; box-shadow:0 0 3px rgba(255,23,68,0.4); }
.uc-status-dot.off { background:#444; }
.uc-footer { display:flex; align-items:center; gap:10px; padding:8px 14px; background:rgba(255,23,68,0.05); border-top:1px solid rgba(255,23,68,0.15); }
.uc-footer .uc-em-label { font-size:12px; font-weight:600; color:#ff5252; }
.uc-footer .uc-em-status { font-size:11px; display:flex; align-items:center; gap:4px; }
.uc-prohibit { display:flex; align-items:center; gap:4px; font-size:10px; color:var(--t3); margin-top:4px; }

/* Cascader Dropdown for Org Selector */
.monitor-filter-bar { display:flex; align-items:center; gap:10px; margin-bottom:12px; padding:8px 12px; background:rgba(255,255,255,0.02); border:1px solid var(--border2); border-radius:6px; }
.monitor-filter-bar .filter-label { font-size:12px; color:var(--t3); white-space:nowrap; }
.cascader-dropdown { position:relative; min-width:340px; }
.cascader-trigger { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:var(--bg3); border:1px solid var(--border); border-radius:4px; cursor:pointer; font-size:13px; color:var(--t); transition:border-color .2s; user-select:none; }
.cascader-trigger:hover { border-color:var(--accent); }
.cascader-trigger.open { border-color:var(--accent); border-radius:4px 4px 0 0; }
.cascader-trigger .cascader-text { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cascader-trigger .cascader-text.placeholder { color:var(--t3); font-weight:400; }
.cascader-trigger .cascader-arrow { font-size:10px; color:var(--t3); transition:transform .2s; flex-shrink:0; margin-left:8px; }
.cascader-trigger.open .cascader-arrow { transform:rotate(180deg); }
.cascader-panel { position:absolute; top:100%; left:0; right:0; z-index:100; background:var(--bg2); border:1px solid var(--accent); border-top:none; border-radius:0 0 6px 6px; box-shadow:0 8px 24px rgba(0,0,0,0.5); overflow:hidden; }
.cascader-search { padding:8px 10px; border-bottom:1px solid var(--border2); }
.cascader-search input { width:100%; padding:7px 10px; background:var(--bg3); border:1px solid var(--border); border-radius:4px; color:var(--t); font-size:12px; font-family:var(--ff); outline:none; }
.cascader-search input:focus { border-color:var(--accent); }
.cascader-search input::placeholder { color:var(--t3); }
.cascader-list { max-height:380px; overflow-y:auto; padding:4px 0; }
.cascader-list::-webkit-scrollbar { width:4px; }
.cascader-list::-webkit-scrollbar-track { background:transparent; }
.cascader-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
/* Tree item row */
.cascader-item { display:flex; align-items:center; padding:8px 10px; color:var(--t2); font-size:12px; transition:all .12s; gap:6px; }
.cascader-item:hover { background:rgba(30,144,255,0.06); }
.cascader-item.active { color:var(--accent); background:rgba(30,144,255,0.1); font-weight:500; }
.cascader-item.active > .cd-label { color:var(--accent); }
/* Level indentation */
.cascader-item.lv0 { font-weight:600; color:var(--t); font-size:13px; padding-left:8px; }
.cascader-item.lv1 { padding-left:28px; font-weight:500; color:#c8ccd0; }
.cascader-item.lv2 { padding-left:48px; }
/* Expand/collapse arrow */
.cd-arrow { width:14px; height:14px; display:inline-flex; align-items:center; justify-content:center; font-size:7px; color:var(--t3); flex-shrink:0; cursor:pointer; transition:transform .2s; border-radius:2px; }
.cd-arrow:hover { color:var(--t); background:rgba(255,255,255,0.05); }
.cd-arrow.open { transform:rotate(90deg); }
.cd-arrow.leaf { visibility:hidden; pointer-events:none; }
/* Clickable label */
.cd-label { flex:1; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cd-label:hover { color:var(--t); }
/* Badge */
.cd-badge { font-size:10px; color:var(--t3); background:rgba(255,255,255,0.04); padding:1px 6px; border-radius:8px; flex-shrink:0; }
/* Children wrapper - collapsible */
.cd-children { overflow:hidden; transition:max-height .25s ease; }
.cd-children:not(.open) { max-height:0; }
.cd-children.open { max-height:2000px; }
/* Empty state */
.cascader-empty { padding:20px; text-align:center; color:var(--t3); font-size:12px; }
/* Search highlight */
.cascader-highlight { color:var(--accent2); background:rgba(0,180,216,0.15); border-radius:2px; padding:0 2px; }

/* Tree Panel (kept for backwards compatibility, not used in new monitorHome) */
.tree-panel { background:var(--bg2); border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:14px; }
.tree-panel.collapsed .tree-search-wrap,
.tree-panel.collapsed .tree-body { display:none; }
.tree-panel.collapsed .tree-header { border-bottom:none; }
.tree-header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:linear-gradient(180deg, rgba(30,144,255,0.06) 0%, transparent 100%); border-bottom:1px solid var(--border); }
.tree-header .tree-title { font-size:15px; font-weight:600; color:var(--t); letter-spacing:0.5px; }
.tree-header .tree-title .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin-right:8px; box-shadow:0 0 8px rgba(30,144,255,0.5); }
.tree-collapse-btn { width:28px; height:28px; border:1px solid var(--border); background:rgba(255,255,255,0.03); color:var(--t2); border-radius:4px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; transition:all .2s; font-family:var(--ff); }
.tree-collapse-btn:hover { background:rgba(255,255,255,0.06); color:var(--t); }
.tree-search-wrap { padding:10px 14px; border-bottom:1px solid var(--border2); position:relative; }
.tree-search-wrap .search-icon { position:absolute; margin:10px 0 0 12px; color:var(--t3); font-size:13px; pointer-events:none; z-index:1; }
.tree-search-wrap input { width:100%; padding:8px 12px 8px 34px; background:var(--bg3); border:1px solid var(--border); border-radius:4px; color:var(--t); font-size:12px; font-family:var(--ff); outline:none; }
.tree-search-wrap input::placeholder { color:var(--t3); }
.tree-search-wrap input:focus { border-color:var(--accent); }
.tree-body { max-height:600px; overflow-y:auto; padding:4px 0; }
.tree-body::-webkit-scrollbar { width:4px; }
.tree-body::-webkit-scrollbar-track { background:transparent; }
.tree-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
/* Tree rows */
.tree-row { display:flex; align-items:center; padding:9px 16px; cursor:pointer; color:var(--t2); font-size:13px; transition:all .15s; gap:8px; position:relative; user-select:none; }
.tree-row:hover { background:rgba(255,255,255,0.025); color:var(--t); }
.tree-row .arrow { width:16px; font-size:8px; color:var(--t3); transition:transform .2s; flex-shrink:0; text-align:center; line-height:1; }
.tree-row.open > .arrow { transform:rotate(90deg); }
.tree-row.leaf .arrow { visibility:hidden; }
.tree-row .label { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tree-row .badge { font-size:10px; color:var(--t3); background:rgba(255,255,255,0.04); padding:2px 7px; border-radius:8px; flex-shrink:0; }
.tree-row.lv-0 { font-weight:600; color:var(--t); font-size:13px; padding:10px 16px; }
.tree-row.lv-1 { padding-left:28px; font-weight:500; color:#c8ccd0; }
.tree-row.lv-2 { padding-left:44px; font-size:13px; color:var(--t2); }
.tree-row.lv-2::before { content:''; position:absolute; left:36px; width:5px; height:5px; border-radius:50%; background:var(--t3); transition:all .2s; }
.tree-row.lv-2:hover::before { background:var(--t2); }
.tree-row.lv-2.selected { color:var(--accent); font-weight:500; }
.tree-row.lv-2.selected::before { background:var(--accent); box-shadow:0 0 6px rgba(30,144,255,0.6); width:6px; height:6px; left:35.5px; animation:treePulse 2s infinite; }
@keyframes treePulse { 0%,100% { box-shadow:0 0 4px rgba(30,144,255,0.4); } 50% { box-shadow:0 0 10px rgba(30,144,255,0.8); } }
.tree-children { overflow:hidden; transition:max-height .3s ease; }
.tree-children:not(.open) { max-height:0; }
.tree-children.open { max-height:3000px; }
.tree-no-results { padding:24px; text-align:center; color:var(--t3); font-size:12px; }
/* Station jump actions */
.tree-row.lv-2 .st-actions { display:none; align-items:center; gap:6px; margin-left:auto; flex-shrink:0; }
.tree-row.lv-2:hover .st-actions { display:flex; }
.tree-row.lv-2.selected .st-actions { display:flex; }
.st-actions select { background:var(--bg3); border:1px solid var(--border); color:var(--t); padding:3px 5px; border-radius:3px; font-size:10px; font-family:var(--ff); max-width:96px; }
.st-actions select:focus { outline:none; border-color:var(--accent); }
.st-actions .jump-btn { padding:3px 8px; background:var(--accent); color:#fff; border:1px solid var(--accent); border-radius:3px; cursor:pointer; font-size:10px; font-family:var(--ff); white-space:nowrap; }
.st-actions .jump-btn:hover { opacity:.85; }
/* Station View */
.station-view { display:none; }
.station-view.open { display:block; }
.st-kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:12px; }
.st-kpi-row.col3 { grid-template-columns:repeat(3,1fr); }
.st-kpi-row.col6 { grid-template-columns:repeat(6,1fr); }
.st-kpi-item { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:12px 14px; text-align:center; backdrop-filter:blur(4px); }
.st-kpi-item .st-kl { font-size:10px; color:var(--t3); margin-bottom:3px; letter-spacing:1px; }
.st-kpi-item .st-kv { font-family:var(--fd); font-size:22px; font-weight:700; color:var(--t); }
.st-kpi-item .st-ks { font-size:9px; color:var(--t2); margin-top:1px; }
.st-kpi-item.accent .st-kv { color:var(--accent); }
.st-kpi-item.good .st-kv { color:var(--green); }

/* Unit Full Card */
.unit-full-card { background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:12px; backdrop-filter:blur(4px); }
.ufc-hdr { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:rgba(30,144,255,0.06); border-bottom:1px solid var(--border2); }
.ufc-name { font-weight:600; font-size:14px; color:var(--accent); }
.ufc-tags { display:flex; gap:6px; }
.ufc-tag { font-size:10px; padding:2px 8px; background:rgba(255,255,255,0.04); border:1px solid var(--border2); border-radius:10px; color:var(--t2); }
.ufc-body { display:grid; grid-template-columns:3fr 2fr; gap:12px; padding:12px; min-height:320px; }
.ufc-left { display:flex; flex-direction:column; gap:10px; }
.ufc-panel { background:rgba(255,255,255,0.02); border:1px solid var(--border2); border-radius:6px; padding:10px; }
.ufc-panel-title { font-size:11px; color:var(--t3); margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--border2); letter-spacing:1px; }
.ufc-stats { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
.ufc-stat { text-align:center; }
.ufc-stat .ufc-sv { font-family:var(--fd); font-size:16px; font-weight:600; color:var(--t); }
.ufc-stat .ufc-sl { font-size:9px; color:var(--t3); margin-top:1px; }
.ufc-stat.highlight .ufc-sv { color:var(--accent2); }
.ufc-run-chart { width:100%; height:200px; }
.ufc-right { min-width:0; }
.ufc-right .ufc-panel { height:100%; display:flex; flex-direction:column; }
.ufc-chart-30d { flex:1; min-height:280px; }

/* Weather strip */
.st-weather-strip { display:flex; gap:6px; overflow-x:auto; padding:8px 0; }
.sw-day { flex-shrink:0; text-align:center; padding:8px 10px; background:rgba(255,255,255,0.03); border:1px solid var(--border2); border-radius:6px; min-width:72px; }
.sw-day.now { border-color:var(--accent); background:rgba(30,144,255,0.06); }
.swd-d { font-size:10px; color:var(--t3); margin-bottom:4px; }
.swd-i { font-size:22px; margin:4px 0; }
.swd-t { font-family:var(--fd); font-size:13px; color:var(--t); font-weight:500; }
.swd-c { font-size:9px; color:var(--t3); margin-top:2px; }

/* Station Section Title */
.st-section-title { font-size:12px; font-weight:600; color:var(--accent); margin:14px 0 8px; padding-left:4px; border-left:3px solid var(--accent); }
.st-section-title span { color:var(--t3); font-weight:400; font-size:10px; margin-left:6px; }

/* Station Charts Row */
.st-charts-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
.st-charts-row.full { grid-template-columns:1fr; }

@media (max-width:1400px) {
  .ufc-body { grid-template-columns:1fr; }
  .st-charts-row { grid-template-columns:1fr; }
  .st-kpi-row { grid-template-columns:repeat(2,1fr); }
}

/* ===== Unit Start/Stop Flow Diagram (HTML+CSS) ===== */
:root { --f-bg:#0d0d0d; --f-card:#161616; --f-blue:#0078d7; --f-cyan:#00e0ff; --f-green:#00e676; --f-red:#ff4444; --f-border:#2a2a2a; --f-sub:#888; }
.flow-wrap { background:var(--f-bg); color:#e0e0e0; font-family:"Microsoft YaHei",sans-serif; user-select:none; overflow:auto; }
.flow-topbar { display:flex; align-items:center; gap:8px; height:40px; padding:0 10px; background:#0a0a0a; border-bottom:1px solid #222; flex-shrink:0; }
.flow-topbtn { padding:5px 12px; border:1px solid #333; background:#141414; color:var(--f-sub); font-size:12px; border-radius:3px; cursor:pointer; font-family:inherit; transition:all .15s; }
.flow-topbtn:hover { color:#ccc; border-color:#555; }
.flow-topbtn.active { background:linear-gradient(180deg,#0099ff,#0077cc); color:#fff; border-color:#0099ff; }
.flow-body { display:flex; gap:0; padding:12px 8px; min-height:480px; }
.flow-col-l { flex:1; display:flex; flex-direction:column; align-items:center; min-width:0; gap:0; }
.flow-col-m { width:180px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; padding:18px 10px; border-left:1px solid #2a2a2a; border-right:1px solid #2a2a2a; }
.flow-col-r { flex:1; display:flex; flex-direction:column; align-items:center; min-width:0; gap:0; }
.flow-col-p { width:126px; flex-shrink:0; padding:8px 10px; border-left:1px solid #222; display:flex; flex-direction:column; gap:5px; }
.flow-tt { color:#fff; font-size:14px; font-weight:400; margin:0 0 4px; text-align:center; }
.flow-nd { background:var(--f-card); border:1px solid var(--f-border); border-radius:4px; padding:7px 16px; min-width:100px; text-align:center; color:#e0e0e0; font-size:13px; }
.flow-nd .fdot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle; }
.flow-nd .fdot.g { background:var(--f-green); box-shadow:0 0 4px rgba(0,230,118,0.3); }
.flow-nd .fdot.r { background:var(--f-red); box-shadow:0 0 4px rgba(255,68,68,0.3); }
.flow-vl { width:1px; height:9px; background:#333; flex-shrink:0; }
.flow-md { background:#1a1a1a; border:1px solid var(--f-border); border-radius:4px; padding:5px 14px; font-size:12px; text-align:center; }
.flow-md .lbl { color:var(--f-sub); }
.flow-md .val { color:var(--f-cyan); font-weight:600; }
.flow-br { display:flex; gap:10px; width:100%; max-width:420px; }
.flow-br .fcd { flex:1; background:var(--f-card); border:1px solid var(--f-border); border-radius:4px; padding:7px 8px; text-align:center; }
.flow-br .fcd.auto { border-color:#5a4a00; }
.flow-br .fcd.water { border-color:#0a4a5a; }
.flow-br .fcd .t { font-size:12px; margin-bottom:3px; }
.flow-br .fcd.auto .t { color:#ffcc00; }
.flow-br .fcd.water .t { color:var(--f-cyan); }
.flow-br .fcd .h { font-size:10px; color:var(--f-sub); margin-bottom:3px; }
.flow-br .fcd .w { font-size:10px; color:#ffcc00; margin-bottom:3px; }
.flow-br .fcd .ok { font-size:10px; color:var(--f-green); margin-top:2px; }
.flow-fbtn { padding:5px 16px; background:linear-gradient(180deg,var(--f-blue),#005a9e); color:#fff; border:none; border-radius:3px; cursor:pointer; font-size:12px; font-family:inherit; }
.flow-fbtn.danger { background:linear-gradient(180deg,#d32f2f,#a00000); }
.flow-fbtn:disabled { opacity:0.25; cursor:not-allowed; }
.flow-dp { display:flex; gap:10px; background:#111; border:1px solid #222; border-radius:4px; padding:7px 12px; flex-wrap:wrap; justify-content:center; }
.flow-dp .di { display:flex; flex-direction:column; align-items:center; min-width:55px; }
.flow-dp .di .v { color:#fff; font-size:13px; font-weight:600; font-family:"Consolas","SF Mono",monospace; }
.flow-dp .di .l { color:var(--f-sub); font-size:10px; }
.flow-ax { display:flex; flex-wrap:wrap; gap:5px 12px; justify-content:center; font-size:11px; }
.flow-ax .ai { display:flex; align-items:center; gap:4px; color:#aaa; }
.flow-ax .ai .dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.flow-ax .ai .dot.g { background:var(--f-green); }
.flow-ax .ai .dot.r { background:var(--f-red); }
.flow-cc { background:var(--f-card); border:1px solid var(--f-border); border-radius:4px; padding:12px 8px; width:100%; text-align:center; }
.flow-cc .t { color:#fff; font-size:12px; }
.flow-cc .s { color:var(--f-cyan); font-size:16px; font-weight:700; margin-top:4px; }
.flow-cbtn { display:flex; flex-direction:column; gap:8px; align-items:center; margin-top:14px; width:100%; }
.flow-cbtn .fgap { height:22px; }
.flow-em { background:#1a1515; border:1px solid #3a2020; border-radius:4px; padding:7px 8px; text-align:center; }
.flow-pl { display:flex; flex-direction:column; gap:5px; }
.flow-pl .pi { display:flex; align-items:center; gap:5px; color:#aaa; font-size:11px; }
.flow-pl .pi .dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; background:var(--f-green); }
.flow-end { background:#162016; border:2px solid #2a4a2a; border-radius:4px; padding:9px 22px; min-width:100px; text-align:center; color:var(--f-green); font-size:14px; font-weight:600; }
.flow-bh { width:100%; max-width:420px; display:flex; align-items:center; padding:0; }
.flow-bh .l { flex:1; height:1px; background:linear-gradient(to right,transparent,#444 60%); }
.flow-bh .r { flex:1; height:1px; background:linear-gradient(to left,transparent,#444 60%); }
.flow-bh+.flow-vl-wrap { display:flex; width:100%; max-width:420px; }
.flow-bh+.flow-vl-wrap>div { flex:1; display:flex; flex-direction:column; align-items:center; }

/* ===== Video Monitoring Grid ===== */
body.vm-active .sidebar { display:none; }
body.vm-active .main { margin-left:0; }
body.vm-active .hdr { display:none; }
body.vm-active .content { padding:0; height:100vh; overflow:hidden; }
.vm-wrap { display:flex; height:100vh; overflow:hidden; background:#0a0e1a; color:#e0e0e0; font-family:"Microsoft YaHei",sans-serif; }
.vm-sidebar { width:220px; flex-shrink:0; background:#0f1115; border-right:1px solid #1a1d28; display:flex; flex-direction:column; overflow-y:auto; }
.vm-sidebar .vm-sys { padding:16px 14px; display:flex; align-items:center; justify-content:space-between; color:#c8ccd0; font-size:13px; font-weight:600; border-bottom:1px solid #1a1d28; cursor:pointer; }
.vm-sidebar .vm-sys .arr { font-size:10px; color:#555; transition:transform .2s; }
.vm-nav-item { display:flex; align-items:center; gap:10px; padding:10px 16px; color:#8b9bb4; font-size:13px; cursor:pointer; transition:all .15s; border-left:3px solid transparent; }
.vm-nav-item:hover { color:#c8ccd0; background:rgba(255,255,255,0.03); }
.vm-nav-item.active { color:#1e88e5; background:rgba(30,136,229,0.12); border-left-color:#1e88e5; }
.vm-nav-item .ico { width:16px; text-align:center; font-size:14px; flex-shrink:0; }
.vm-sidebar .vm-foot { margin-top:auto; padding:12px 14px; border-top:1px solid #1a1d28; color:#555; font-size:11px; }
.vm-main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
.vm-topbar { display:flex; align-items:center; gap:14px; padding:10px 16px; background:#0f1115; border-bottom:1px solid #1a1d28; flex-shrink:0; }
.vm-topbar .vm-tt { color:#fff; font-size:18px; font-weight:700; white-space:nowrap; }
.vm-topbar .vm-tip { flex:1; background:#1a1d26; border-radius:16px; padding:5px 14px; color:#888; font-size:11px; text-align:center; white-space:nowrap; }
.vm-topbar .vm-pager { display:flex; align-items:center; gap:6px; }
.vm-topbar .vm-pager .pg { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer; color:#8b9bb4; transition:all .15s; }
.vm-topbar .vm-pager .pg.active { background:#1e88e5; color:#fff; }
.vm-topbar .vm-pager .pg.arrow { font-size:10px; }
.vm-topbar .vm-btn { padding:6px 14px; border-radius:4px; border:none; color:#fff; font-size:12px; cursor:pointer; font-family:inherit; transition:all .15s; }
.vm-topbar .vm-btn.blue { background:#1e88e5; }
.vm-topbar .vm-btn.red { background:#e53935; }
.vm-grid-wrap { flex:1; overflow-y:auto; overflow-x:hidden; padding:14px 16px; }
.vm-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
@media (max-width:1200px) { .vm-grid { grid-template-columns:repeat(3,1fr); } }
@media (max-width:768px) { .vm-grid { grid-template-columns:repeat(2,1fr); } }
.vm-card { background:#0f1115; border:1px solid #1e293b; border-radius:6px; overflow:hidden; transition:all .2s; cursor:pointer; }
.vm-card:hover { border-color:#334155; box-shadow:0 4px 16px rgba(0,0,0,0.3); }
.vm-card .vid { position:relative; aspect-ratio:16/9; background:#000; overflow:hidden; }

.vm-card .vbar { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; background:#1a1d26; }

.vm-card .vbar .vbar-l .vdot { width:7px; height:7px; border-radius:50%; background:#00e676; flex-shrink:0; }

// ===== SIDEBAR =====
let currentPage = 'monitorHome';
function renderSidebar() {
  const nav = document.getElementById('sideNav');
  let html = '';
  MENU.forEach((item, i) => {
    const hasKids = item.kids && item.kids.length > 0;
    const hasActive = hasKids && item.kids.some(k => k.page === currentPage || (k.kids && k.kids.some(s => s.page === currentPage))); const isOpen = i <= 2 || hasActive;
    html += '<div class="ng' + (isOpen ? ' open' : '') + '">';
    if (hasKids) {
      html += '<div class="ngh" data-action="toggle"><span class="ic">'+(item.icon||'')+'</span><span>'+item.name+'</span><span class="ar">▶</span></div>';
      html += '<div class="nc">';
      item.kids.forEach(kid => {
        const kidHasKids = kid.kids && kid.kids.length > 0;
        if (kidHasKids) {
          html += '<div class="ng open">';
          html += '<div class="ngh ngh-sub" data-action="toggle"><span class="dot"></span><span>'+kid.name+'</span><span class="ar">▶</span></div>';
          html += '<div class="nc">';
          kid.kids.forEach(sub => {
            html += '<div class="nci'+(currentPage===sub.page?' active':'')+'" data-page="'+sub.page+'"><span class="dot"></span><span>'+sub.name+'</span></div>';
          });
          html += '</div></div>';
        } else {
          html += '<div class="nci'+(currentPage===kid.page?' active':'')+'" data-page="'+kid.page+'"><span class="dot"></span><span>'+kid.name+'</span></div>';
        }
      });
      html += '</div>';
    } else {
      html += '<div class="ngh'+(currentPage===item.page?' active':'')+'" data-page="'+item.page+'"><span class="ic">'+(item.icon||'')+'</span><span>'+item.name+'</span></div>';
    }
    html += '</div>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.ngh[data-action="toggle"]').forEach(el => {
    el.addEventListener('click', function(e) { e.stopPropagation(); this.parentElement.classList.toggle('open'); });
  });
  nav.querySelectorAll('.ngh[data-page]').forEach(el => {
    el.addEventListener('click', function() { navigateTo(this.dataset.page); });
  });
  nav.querySelectorAll('.nci[data-page]').forEach(el => {
    el.addEventListener('click', function() { navigateTo(this.dataset.page); });
  });
}
function updateSidebarActive() {
  const nav = document.getElementById('sideNav');
  nav.querySelectorAll('.nci.active, .ngh.active').forEach(el => el.classList.remove('active'));
  const el = nav.querySelector('.nci[data-page="'+currentPage+'"], .ngh[data-page="'+currentPage+'"]');
  if (el) el.classList.add('active');
  let p = el ? el.parentElement : null;
  while (p && p !== nav) {
    if (p.classList.contains('ng') && !p.classList.contains('open')) {
      p.classList.add('open');
    }
    p = p.parentElement;
  }
}
function navigateTo(pageId) {
  currentPage = pageId;
  let label = pageId;
  MENU.forEach(g => {
    if (g.page === pageId) label = g.name;
    if (g.kids) g.kids.forEach(k => {
      if (k.page === pageId) label = g.name + ' / ' + k.name;
      if (k.kids) k.kids.forEach(s => { if (s.page === pageId) label = g.name + ' / ' + k.name + ' / ' + s.name; });
    });
  });
  document.getElementById('breadcrumb').textContent = label;
  updateSidebarActive();
  renderPage(pageId);
}

// ===== MONITOR ORG CASCADER =====
let _treeActiveCenter = null;
let _treeSelectedStation = null;

function buildOrgCascaderList(filter) {
  var d = window._MONITOR_DATA || {};
  var centers = d.opsCenters || [];
  var rootName = d.rootName || '小水电集控中心';
  var list = document.getElementById('orgCascaderList');
  if (!list) return;
  var kw = (filter||'').toLowerCase().trim();

  // Compute match state per node
  var rootMatch = !kw || rootName.toLowerCase().indexOf(kw) >= 0;
  var centerStates = [];
  var anyChildMatch = false;
  centers.forEach(function(c) {
    var cname = esc(c.companyName||'');
    var cMatch = !kw || cname.toLowerCase().indexOf(kw) >= 0;
    var stMatches = [];
    (c.children||[]).forEach(function(s) {
      var sm = esc(s.companyName||'').toLowerCase().indexOf(kw) >= 0;
      if (sm) anyChildMatch = true;
      stMatches.push({s:s, match:!kw || sm});
    });
    if (cMatch) anyChildMatch = true;
    centerStates.push({c:c, match:cMatch, stations:stMatches});
  });

  function csAny(s){return s.some(function(x){return x.match;});}
  var html = '';
  if (!kw || rootMatch || anyChildMatch) {
    var rActive = !_treeActiveCenter && !_treeSelectedStation;
    var rOpen = !kw || rActive || rootMatch || anyChildMatch;
    html += '<div class="cascader-item lv0'+(rActive?' active':'')+'" data-level="0" data-id="_group">'
      +'<span class="cd-arrow'+(rOpen?' open':'')+'" onclick="toggleTreeChildren(this)">&#9654;</span>'
      +'<span class="cd-label" onclick="selectOrgItem(\'_group\',0,\''+esc(rootName)+'\')">'+highlightMatch(esc(rootName),kw)+'</span>'
      +'<span class="cd-badge">'+centers.length+' 中心</span>'
      +'</div>';
    html += '<div class="cd-children'+(rOpen?' open':'')+'">';

    centerStates.forEach(function(cs) {
      var hasSm = csAny(cs.stations);
      if (kw && !cs.match && !hasSm) return;
      var cn = esc(cs.c.companyName||'');
      var cActive = _treeActiveCenter===cs.c.id && !_treeSelectedStation;
      var cOpen = !kw || cActive || cs.match || hasSm;
      html += '<div class="cascader-item lv1'+(cActive?' active':'')+'" data-level="1" data-id="'+cs.c.id+'">'
        +'<span class="cd-arrow'+(cOpen?' open':'')+'" onclick="toggleTreeChildren(this)">&#9654;</span>'
        +'<span class="cd-label" onclick="selectOrgItem(\''+cs.c.id+'\',1,\''+cn+'\')">'+highlightMatch(cn,kw)+'</span>'
        +'<span class="cd-badge">'+cs.stations.length+' 站</span>'
        +'</div>';
      html += '<div class="cd-children'+(cOpen?' open':'')+'">';

      cs.stations.forEach(function(st) {
        if (kw && !st.match) return;
        var sn = esc(st.s.companyName||'');
        var sActive = _treeSelectedStation===st.s.id;
        html += '<div class="cascader-item lv2'+(sActive?' active':'')+'" data-level="2" data-id="'+st.s.id+'" data-cid="'+cs.c.id+'">'
          +'<span class="cd-arrow leaf">&#9654;</span>'
          +'<span class="cd-label" onclick="selectOrgItem(\''+st.s.id+'\',2,\''+sn+'\',\''+cs.c.id+'\')">'+highlightMatch(sn,kw)+'</span>'
          +'</div>';
      });

      html += '</div>';
    });

    html += '</div>';
  }
  if (!html) html = '<div class="cascader-empty">未找到匹配的组织</div>';
  list.innerHTML = html;
}

function highlightMatch(text, kw) {
  if (!kw) return esc(text);
  var idx = esc(text).toLowerCase().indexOf(kw);
  if (idx < 0) return esc(text);
  var before = esc(text.substring(0, idx));
  var match = esc(text.substring(idx, idx + kw.length));
  var after = esc(text.substring(idx + kw.length));
  return before + '<span class="cascader-highlight">' + match + '</span>' + after;
}

function toggleTreeChildren(arrowEl) {
  arrowEl.classList.toggle('open');
  var children = arrowEl.parentElement.nextElementSibling;
  if (children && children.classList.contains('cd-children')) {
    children.classList.toggle('open');
  }
}

  var sel = document.getElementById('orgBizType');

function toggleOrgCascader() {
  var panel = document.getElementById('orgCascaderPanel');
  var trigger = document.getElementById('orgCascaderTrigger');
  if (!panel || !trigger) return;
  var isOpen = panel.style.display === 'block';
  if (isOpen) {
    panel.style.display = 'none';
    trigger.classList.remove('open');
  } else {
    panel.style.display = 'block';
    trigger.classList.add('open');
    buildOrgCascaderList();
    var inp = document.getElementById('orgCascaderSearch');
    if (inp) { inp.value = ''; inp.focus(); }
  }
}

function filterOrgCascader() {
  var inp = document.getElementById('orgCascaderSearch');
  var kw = inp ? inp.value : '';
  buildOrgCascaderList(kw);
}

function selectOrgItem(id, level, name, centerId) {
  var d = window._MONITOR_DATA || {};
  var rootName = d.rootName || '小水电集控中心';
  var centers = d.opsCenters || [];

  // Build full hierarchical path
  var path = rootName;
  if (level === 1) {
    path += ' / ' + esc(name);
  } else if (level === 2 && centerId) {
    var cn = name;
    for (var i=0; i<centers.length; i++) {
      if (centers[i].id === centerId) { cn = esc(centers[i].companyName) + ' / ' + esc(name); break; }
    }
    path += ' / ' + cn;
  }

  var txt = document.getElementById('orgCascaderText');
  if (txt) { txt.textContent = path; txt.classList.remove('placeholder'); }

  var panel = document.getElementById('orgCascaderPanel');
  var trigger = document.getElementById('orgCascaderTrigger');
  if (panel) panel.style.display = 'none';
  if (trigger) trigger.classList.remove('open');

  buildOrgCascaderList();

  if (level === 0) {
    selectTreeGroup();
  } else if (level === 1) {
    selectOpsCenter(id);
  } else if (level === 2) {
    if (centerId) selectOpsCenter(centerId);
    selectStation(id);
  }
}

// Close cascader on outside click
document.addEventListener('click', function(e) {
  var cascader = document.getElementById('orgCascader');
  if (!cascader) return;
  if (!cascader.contains(e.target)) {
    var panel = document.getElementById('orgCascaderPanel');
    var trigger = document.getElementById('orgCascaderTrigger');
    if (panel) panel.style.display = 'none';
    if (trigger) trigger.classList.remove('open');
  }
});

// ===== USER TABLE FILTER & SORT =====
var _userSortField = null;
var _userSortAsc = true;

function filterUserTable() {
  var searchText = (document.getElementById('userSearchInput')||{}).value || '';
  var roleFilter = (document.getElementById('userRoleFilter')||{}).value || '';
  var statusFilter = (document.getElementById('userStatusFilter')||{}).value || '';
  var tbody = document.getElementById('userTableBody');
  var countEl = document.getElementById('userTableCount');
  var filterCountEl = document.getElementById('userFilterCount');
  if (!tbody) return;
  var rows = tbody.querySelectorAll('tr');
  var visible = 0;
  rows.forEach(function(row) {
    var searchData = row.getAttribute('data-search') || '';
    var role = row.getAttribute('data-role') || '';
    var status = row.getAttribute('data-status') || '';
    var matchSearch = !searchText || searchData.indexOf(searchText.toLowerCase()) !== -1;
    var matchRole = !roleFilter || role === roleFilter;
    var matchStatus = !statusFilter || status === statusFilter;
    if (matchSearch && matchRole && matchStatus) {
      row.style.display = '';
      visible++;
    } else {
      row.style.display = 'none';
    }
  });
  if (countEl) countEl.textContent = '共' + visible + '条记录';
  if (filterCountEl) filterCountEl.textContent = '筛选结果：' + visible + '条';
}

function sortUserTable(field) {
  var tbody = document.getElementById('userTableBody');
  if (!tbody) return;
  var rows = Array.from(tbody.querySelectorAll('tr'));
  if (_userSortField === field) {
    _userSortAsc = !_userSortAsc;
  } else {
    _userSortField = field;
    _userSortAsc = true;
  }
  rows.sort(function(a, b) {
    var va = a.getAttribute('data-search') || '';
    var vb = b.getAttribute('data-search') || '';
    if (field === 'uid') { va = a.cells[0].textContent.trim(); vb = b.cells[0].textContent.trim(); }
    else if (field === 'username') { va = a.cells[1].textContent.trim(); vb = b.cells[1].textContent.trim(); }
    else if (field === 'fullName') { va = a.cells[2].textContent.trim(); vb = b.cells[2].textContent.trim(); }
    else if (field === 'role') { va = a.cells[3].textContent.trim(); vb = b.cells[3].textContent.trim(); }
    else if (field === 'company') { va = a.cells[4].textContent.trim(); vb = b.cells[4].textContent.trim(); }
    else if (field === 'state') { va = a.cells[7].textContent.trim(); vb = b.cells[7].textContent.trim(); }
    else if (field === 'lastLogin') { va = a.cells[8].textContent.trim(); vb = b.cells[8].textContent.trim(); }
    else { va = a.cells[0].textContent.trim(); vb = b.cells[0].textContent.trim(); }
    var cmp = va.localeCompare(vb, 'zh');
    return _userSortAsc ? cmp : -cmp;
  });
  rows.forEach(function(row) { tbody.appendChild(row); });
}

function drawStationCharts(){
  var sd = window._STATION_DATA || {};
  var devDetail = (sd.deviceDetail||{}).body||[];
  var weatherNearest = (sd.weatherNearest||{}).body||[];

  // Mock 30-day data if API data is empty
  function mock30Day() {
    var dates = []; var vals = [];
    var now = new Date();
    for (var i = 29; i >= 0; i--) {
      var d = new Date(now); d.setDate(d.getDate()-i);
      dates.push((d.getMonth()+1)+'/'+d.getDate());
      vals.push(Math.round(Math.random()*8000+2000));
    }
    return {dates:dates, vals:vals};
  }

  // Mock hourly data for real-time chart
  function mockHourly() {
    var hours = []; var vals = [];
    for (var i = 0; i < 24; i++) {
      hours.push(i+':00');
      vals.push(Math.round(Math.random()*400+100));
    }
    return {hours:hours, vals:vals};
  }

  // Mock monthly data
  function mockMonthly() {
    var months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    var fdl = months.map(function(){return (Math.random()*60+10).toFixed(2);});
    var rain = months.map(function(){return (Math.random()*200+20).toFixed(1);});
    return {months:months, fdl:fdl, rain:rain};
  }

  // --- Chart 1: 实时发电量/降雨量趋势 ---
  var elRT = document.getElementById('chartStRealtime');
  if (elRT) {
    if (window._stRT) window._stRT.dispose();
    var mh = mockHourly();
    var chart = echarts.init(elRT); window._stRT = chart;
    chart.setOption({
      tooltip: {trigger:'axis'},
      legend: {data:['实时发电量','降雨量'],textStyle:{fontSize:10,color:'#8899b4'},top:0},
      grid: {left:50,right:50,top:30,bottom:24},
      xAxis: {type:'category',data:mh.hours,axisLabel:{fontSize:9,color:'#5a6d84'},axisLine:{lineStyle:{color:'rgba(255,255,255,0.08)'}}},
      yAxis: [
        {type:'value',name:'kW',axisLabel:{fontSize:9,color:'#5a6d84'},splitLine:{lineStyle:{color:'rgba(255,255,255,0.04)'}}},
        {type:'value',name:'mm',axisLabel:{fontSize:9,color:'#5a6d84'},splitLine:{show:false}}
      ],
      series: [
        {name:'实时发电量',type:'line',data:mh.vals,lineStyle:{color:'#1e90ff',width:2},itemStyle:{color:'#1e90ff'},symbol:'circle',symbolSize:3,areaStyle:{color:'rgba(30,144,255,0.1)'}},
        {name:'降雨量',type:'bar',yAxisIndex:1,data:mh.vals.map(function(){return (Math.random()*1.5).toFixed(1);}),itemStyle:{color:'#00b4d8'},barMaxWidth:8,barGap:'20%'}
      ]
    });
  }

  // --- Chart 2: 近期发电量/降雨量趋势 (30-day) ---
  var el30 = document.getElementById('chartStRecent');
  if (el30) {
    if (window._stRecent) window._stRecent.dispose();
    var fdlS = null, pcpnS = null;
    (weatherNearest||[]).forEach(function(s){if(s.type==='fdl')fdlS=s;if(s.type==='pcpn')pcpnS=s;});
    var fx, fy, py;
    if (fdlS && fdlS.x && fdlS.x.length > 0) {
      fx = fdlS.x.map(function(d){return d.substring(5);});
      fy = (fdlS.y||[]).map(function(v){return parseFloat(v)||0;});
      py = (pcpnS&&pcpnS.y||[]).map(function(v){return parseFloat(v)||0;});

      var m30 = mock30Day();
      fx = m30.dates; fy = m30.vals; py = m30.vals.map(function(){return (Math.random()*8).toFixed(1);});
    }
    var chart = echarts.init(el30); window._stRecent = chart;
    chart.setOption({
      tooltip: {trigger:'axis'},
      legend: {data:['发电量','降雨量'],textStyle:{fontSize:10,color:'#8899b4'},top:0},

      tooltip: {trigger:'axis'},

      grid: {left:50,right:50,top:30,bottom:24},

function renderSCADA(canvasId, sceneKey) {
  try {
    var canvas = document.getElementById(canvasId);
    if (!canvas) return;
    var data = window._SP_SCENE_DATA;
    if (!data || !data[sceneKey]) return;
    var scene = data[sceneKey];
    // Skip if already rendered
    if (canvas.dataset.rendered === sceneKey) return;
    canvas.dataset.rendered = sceneKey;
    canvas.innerHTML = '';

    // Calculate scale to fit container
    var wrap = canvas.parentElement;
    var wrapW = wrap.clientWidth - 4;
    var wrapH = wrap.clientHeight - 4;
    var scale = Math.min(wrapW / 1920, wrapH / 1040);
    canvas.style.width = '1920px';
    canvas.style.height = '1040px';
    canvas.style.transform = 'scale(' + scale + ')';

    var nodes = scene.nodes || [];
    nodes.forEach(function(n) {
      var el = document.createElement('div');
      el.className = 'scene-node ' + (n.t || '');
      el.style.left = n.x + 'px';
      el.style.top = n.y + 'px';
      el.style.width = Math.max(n.w, 1) + 'px';
      el.style.height = Math.max(n.h, 1) + 'px';

      // Text content
      var txt = n.tx || n.n || '';
      if (txt) el.textContent = txt;

      // Color handling: dark text on dark bg → make readable
      var color = n.tc || '';
      if (color && color.indexOf('rgba(0,') === -1 && color.indexOf('rgb(0,') === -1) {
        el.style.color = color;
      } else if (color && (color.indexOf('rgba(0,') >= 0 || color.indexOf('rgb(0,') >= 0 || color === '#000')) {
        el.style.color = '#999'; // Invert dark text to light
      }
      if (n.ts) el.style.fontSize = Math.max(9, Math.round(n.ts * 0.65)) + 'px';
      if (n.bg) el.style.background = n.bg;
      if (n.ly === 'background') el.style.opacity = '0.3';

      // Special node types
      if (n.t === 'bus') {
        el.style.background = 'rgba(255,255,255,0.25)';
        el.style.border = 'none';
        el.style.borderRadius = '1px';
      }
      if (n.t === 'port') {
        el.style.width = Math.max(n.w, 10) + 'px';
        el.style.height = Math.max(n.h, 10) + 'px';
        el.style.borderRadius = '50%';
        el.style.background = 'rgba(255,255,255,0.08)';
        el.style.border = '1px solid rgba(255,255,255,0.25)';
      }
      if (n.t === 'breaker') {
        el.style.background = 'rgba(0,200,83,0.15)';
        el.style.border = '1px solid rgba(0,200,83,0.4)';
        el.style.borderRadius = '4px';
      }
      if (n.t === 'dynamo') {
        el.style.borderRadius = '50%';
        el.style.background = 'rgba(30,144,255,0.08)';
        el.style.border = '2px solid rgba(30,144,255,0.4)';
      }
      if (n.t === 'daozha') {
        el.style.width = Math.max(n.w, 20) + 'px';
        el.style.height = Math.max(n.h, 20) + 'px';
        el.style.borderRadius = '50%';
        el.style.background = 'rgba(255,145,0,0.15)';
        el.style.border = '2px solid rgba(255,145,0,0.5)';
      }
      if (n.t === 'triangle') {
        el.style.width = '0'; el.style.height = '0';
        el.style.borderLeft = '8px solid transparent';
        el.style.borderRight = '8px solid transparent';
        el.style.borderBottom = '14px solid var(--accent)';
        el.style.background = 'none';
        el.style.borderRadius = '0';
      }
      if (n.t === 'changbian') {
        el.style.background = 'rgba(156,39,176,0.1)';
        el.style.border = '2px solid rgba(156,39,176,0.4)';
        el.style.borderRadius = '4px';
      }
      if (n.t === 'bxdl') {
        el.style.background = 'rgba(255,214,0,0.1)';
        el.style.border = '2px solid rgba(255,214,0,0.4)';
      }
      if (n.t === 'button') {
        el.style.cursor = 'pointer';
        var btnTxt = (n.tx||'').toString();
        if (btnTxt.indexOf('停机')>=0 || btnTxt.indexOf('紧停')>=0 || btnTxt.indexOf('非停')>=0) {
          el.classList.add('warn');
        }
      }
      if (n.t === 'data') {
        el.style.color = '#00e5ff';
        el.style.fontWeight = '600';
        el.style.fontSize = Math.max(10, Math.round((n.ts||14) * 0.62)) + 'px';
        if (n.vr) el.setAttribute('data-var', n.vr);
        var dataLabel = n.n || n.tx || '';
        el.setAttribute('data-label', dataLabel);
        var dataVal = getSimScadaValue(dataLabel, n.vr||'');
        el.textContent = dataLabel + ' ' + dataVal;
      }
      if (n.t === 'label' && txt === '--') {
        var nn = n.n || '';
        if (nn.indexOf('机组工作模式')>=0) el.textContent = '自动发电';
        else if (nn.indexOf('励磁运行模式')>=0) el.textContent = '恒功率因数';

        el.style.overflow = 'hidden';

      canvas.appendChild(el);
    });
  } catch(e) { console.error('renderSCADA error:', e); }
}
function getSimScadaValue(n, vr) {

  if (label.indexOf('高功水位')>=0) return (3.20 + (Math.random()-0.5)*0.04).toFixed(2) + ' m';
  if (label.indexOf('低功水位')>=0) return (1.95 + (Math.random()-0.5)*0.04).toFixed(2) + ' m';
  if (label.indexOf('开机水位')>=0) return (2.50 + (Math.random()-0.5)*0.04).toFixed(2) + ' m';
  if (label.indexOf('停机水位')>=0) return (1.80 + (Math.random()-0.5)*0.04).toFixed(2) + ' m';
  if (label.indexOf('栅前水位')>=0) return (3.15 + (Math.random()-0.5)*0.06).toFixed(2) + ' m';
  if (label.indexOf('栅后水位')>=0) return (2.85 + (Math.random()-0.5)*0.06).toFixed(2) + ' m';
  if (label.indexOf('水位差')>=0) return (0.30 + (Math.random()-0.5)*0.02).toFixed(2) + ' m';
  // Power values
  if (label.indexOf('有功功率')>=0 || label.indexOf('机组有功')>=0) return (245.8 + (Math.random()-0.5)*60).toFixed(1) + ' kW';
  if (label.indexOf('无功功率')>=0 || label.indexOf('机组无功')>=0) return (52.3 + (Math.random()-0.5)*20).toFixed(1) + ' kVar';
  if (label.indexOf('电站总有功')>=0) return (492.6 + (Math.random()-0.5)*80).toFixed(1) + ' kW';
  if (label.indexOf('功率因数')>=0) return (0.92 + (Math.random()-0.5)*0.06).toFixed(2);
  // Frequency
  if (label.indexOf('机组频率')>=0) return (50.02 + (Math.random()-0.5)*0.15).toFixed(2) + ' Hz';
  // Voltage
  if (label.indexOf('机端Uab')>=0||label.indexOf('机端Ubc')>=0||label.indexOf('机端电压')>=0) return (398.5 + (Math.random()-0.5)*8).toFixed(1) + ' V';
  if (label.indexOf('系统Uab')>=0||label.indexOf('电网电压')>=0) return (10.52 + (Math.random()-0.5)*0.2).toFixed(2) + ' kV';
  // Current
  if (label.indexOf('A相电流')>=0) return (356.2 + (Math.random()-0.5)*40).toFixed(1) + ' A';
  if (label.indexOf('B相电流')>=0) return (352.8 + (Math.random()-0.5)*40).toFixed(1) + ' A';
  if (label.indexOf('C相电流')>=0) return (359.1 + (Math.random()-0.5)*40).toFixed(1) + ' A';
  // Temperatures
  if (label.indexOf('前导瓦温')>=0) return (58.3 + (Math.random()-0.5)*4).toFixed(1) + ' °C';
  if (label.indexOf('后导瓦温')>=0) return (55.7 + (Math.random()-0.5)*4).toFixed(1) + ' °C';
  if (label.indexOf('推力瓦温')>=0) return (52.1 + (Math.random()-0.5)*3).toFixed(1) + ' °C';
  if (label.indexOf('励磁A温')>=0) return (48.2 + (Math.random()-0.5)*3).toFixed(1) + ' °C';
  if (label.indexOf('励磁B温')>=0) return (47.5 + (Math.random()-0.5)*3).toFixed(1) + ' °C';
  if (label.indexOf('励磁C温')>=0) return (49.1 + (Math.random()-0.5)*3).toFixed(1) + ' °C';
  if (label.indexOf('主变温度')>=0) return (42.8 + (Math.random()-0.5)*3).toFixed(1) + ' °C';
  // Excitation
  if (label.indexOf('励磁电流')>=0) return (2.85 + (Math.random()-0.5)*0.5).toFixed(2) + ' A';
  // Energy
  if (label.indexOf('有功电度')>=0) return (128563.4 + Math.random()*20).toFixed(1) + ' kWh';
  if (label.indexOf('无功电度')>=0) return (35218.7 + Math.random()*10).toFixed(1) + ' kVarh';
  // Setpoints
  if (label.indexOf('有功给定')>=0) return (250).toFixed(0) + ' kW';
  if (label.indexOf('增减步长')>=0) return (10).toFixed(0) + ' kW';

  if (label.indexOf('恒机端电压给定值')>=0) return '400 V';
  return '--';
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/江河/g,'小水电'); }
function fmtTs(ts) {
  if (!ts || ts==='0') return '-';
  const d = new Date(parseInt(ts)*1000);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDt(s) {
  if (!s) return '-';
  if (/^\d{10,13}$/.test(s)) return fmtTs(s);
  return esc(s).split(' ')[0] || '-';
}
function badge(s, cls) { return '<span class="badge '+cls+'">'+esc(s)+'</span>'; }
function statusBadge(s) {
  if (s==='end'||s==='已结束') return badge('已结束','be');
  if (s==='progress'||s==='p0020'||s==='pw003'||s==='an004') return badge('进行中','bp');
  if (s==='open') return badge('未处理','bo');
  return badge(esc(s||'-'),'');
}
function levelBadge(l) {
  const cls = l==1?'lv1':l==2?'lv2':'lv3';

}
function shiftBadge(n) { return '<span class="shift-tag s'+n+'">班'+n+'</span>'; }
function taskStatText(s) {

function stationType(s) {

    h += '<div class="vm-foot"><div style="color:#8b9bb4;margin-bottom:4px" id="vmDate">--</div><div>视频监控系统 v2.0</div></div>';
    h += '</div>';

    // ===== MAIN AREA =====
    h += '<div class="vm-main">';

    // Top bar
    h += '<div class="vm-topbar">';
    h += '<div class="vm-tt">视频监控</div>';
    h += '<div class="vm-tip">此页面支持最多3个机位同时播放！</div>';
    h += '<div class="vm-pager">';
    h += '<span class="pg arrow" onclick="void(0)">◀</span>';
    for (var pi = 1; pi <= 4; pi++) {
      h += '<span class="pg'+(pi===1?' active':'')+'" onclick="void(0)">'+pi+'</span>';
    }
    h += '<span class="pg arrow" onclick="void(0)">▶</span>';
    h += '</div>';
    h += '<button class="vm-btn blue" onclick="void(0)" title="语音通话">📞</button>';
    h += '<button class="vm-btn red" onclick="void(0)" title="智慧运行">⚡ 智慧运行</button>';
    h += '<button class="vm-btn red" onclick="void(0)" title="告警">🔔 告警</button>';
    h += '</div>';

    // Video grid
    h += '<div class="vm-grid-wrap"><div class="vm-grid">';
    var ts = '2026年05月15日 星期五 12:15:46';
    locations.forEach(function(loc, i){
      var imgSrc = genPlaceholder(i+1);
      h += '<div class="vm-card" onclick="void(0)">';
      h += '<div class="vid">';
      h += '<img src="'+imgSrc+'" alt="'+esc(loc)+'" loading="lazy"/>';
      h += '<div class="v-ts">'+ts+'</div>';
      h += '<div class="v-loc">'+esc(loc)+'</div>';
      h += '</div>';
      h += '<div class="vbar">';
      h += '<div class="vbar-l"><span class="vdot"></span>'+esc(loc)+'</div>';
      h += '<div class="vbar-r"><span onclick="event.stopPropagation();void(0)">↺ 回放</span><span onclick="event.stopPropagation();void(0)">▶ 直播</span></div>';
      h += '</div>';
      h += '</div>';
    });
    h += '</div></div>';

    h += '</div>'; // vm-main
    h += '</div>'; // vm-wrap

    // Update sidebar clock
    setTimeout(function(){
      var now = new Date();
      var days = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
      var s = now.getFullYear()+'/'+String(now.getMonth()+1).padStart(2,'0')+'/'+String(now.getDate()).padStart(2,'0');
      s += ' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
      s += ' '+days[now.getDay()];
      var el = document.getElementById('vmDate');
      if (el) el.textContent = s;
    }, 10);
    break;
  }

  // ========== 智能监控 > 告警管理 ==========
  case 'alarmMgmt': {
    const SM = window.SMART_MONITOR_DATA || {};
    const am = SM.alarmMessages_JJY || {};
    const ae = SM.alarmEvents_JJY || {};
    const messages = am.records || [];
    const events = ae.records || [];

    h += '<div class="page-title">告警管理</div>';
    h += '<div class="page-sub">告警消息共 '+((am.total||0).toLocaleString())+' 条 &nbsp;|&nbsp; 告警事件共 '+((ae.total||0).toLocaleString())+' 条</div>';

    h += '<div class="kpi-row">';
    h += '<div class="kpi good"><div class="kl">告警消息总数</div><div class="kv">'+((am.total||0).toLocaleString())+'</div><div class="ks">全部历史消息</div></div>';
    h += '<div class="kpi"><div class="kl">告警事件总数</div><div class="kv">'+((ae.total||0).toLocaleString())+'</div><div class="ks">全部历史事件</div></div>';
    h += '<div class="kpi"><div class="kl">当前展示消息</div><div class="kv">'+messages.length+'</div><div class="ks">最近记录</div></div>';
    h += '<div class="kpi"><div class="kl">当前展示事件</div><div class="kv">'+events.length+'</div><div class="ks">最近记录</div></div>';
    h += '</div>';

    h += '<div class="mgrid">';
    h += '<div class="card"><div class="card-header"><span class="ct">告警消息 · 最近记录</span><span class="cn">共 '+((am.total||0).toLocaleString())+' 条</span></div>';
    h += '<div class="card-body"><table class="tbl"><thead><tr><th>告警内容</th><th>电站</th><th>等级</th><th>告警时间</th><th>恢复时间</th><th>状态</th></tr></thead><tbody>';
    messages.forEach(m => {
      const at = m.alarmTime ? new Date(parseInt(m.alarmTime)*1000).toISOString().slice(0,16).replace('T',' ') : '-';
      const rt = m.resetTime ? new Date(parseInt(m.resetTime)*1000).toISOString().slice(0,16).replace('T',' ') : '-';
      const status = m.resetTime ? 'end' : 'open';
      h += '<tr><td>'+esc(m.content||'-')+'</td><td>'+esc(m.companyName||'-')+'</td><td>'+levelBadge(m.level)+'</td><td class="date-col">'+at+'</td><td class="date-col">'+rt+'</td><td>'+statusBadge(status)+'</td></tr>';
    });
    h += '</tbody></table></div></div>';

    h += '<div class="card"><div class="card-header"><span class="ct">告警事件 · 最近记录</span><span class="cn">共 '+((ae.total||0).toLocaleString())+' 条</span></div>';
    h += '<div class="card-body"><table class="tbl"><thead><tr><th>事件内容</th><th>电站</th><th>事件类型</th><th>等级</th><th>事件时间</th></tr></thead><tbody>';
    events.forEach(e => {
      const et = e.eventTime ? new Date(parseInt(e.eventTime)*1000).toISOString().slice(0,16).replace('T',' ') : '-';
      h += '<tr><td>'+esc(e.content||'-')+'</td><td>'+esc(e.companyName||'-')+'</td><td>'+esc(e.eventTypeDesc||e.eventType||'-')+'</td><td>'+levelBadge(e.level)+'</td><td class="date-col">'+et+'</td></tr>';
    });
    h += '</tbody></table></div></div>';
    h += '</div>';
    break;
  }

  // ========== 智能监控 > 生态流量 ==========
  case 'ecoFlow': {
    const SM = window.SMART_MONITOR_DATA || {};
    const efRaw = SM.ecoFlowList || {};
    const efRecords = (efRaw.body && efRaw.body.records) ? efRaw.body.records : (efRaw.records || []);
    const ef24h = SM.ecoFlow24h_JJY || {};

    h += '<div class="page-title">生态下泄流量</div>';
    h += '<div class="page-sub">共 '+efRecords.length+' 个监测站点 &nbsp;|&nbsp; 数据来源：生态流量监测系统</div>';

    let totalFlow = 0, onlineCount = 0;
    efRecords.forEach(r => {
      totalFlow += parseFloat(r.ecologicalFlowSum) || parseFloat(r.ecologicalFlow1) || 0;
      if (r.passStat == 1 || r.deviceStatStr == '在线') onlineCount++;
    });
    h += '<div class="kpi-row">';
    h += '<div class="kpi good"><div class="kl">监测站点数</div><div class="kv">'+efRecords.length+'</div><div class="ks">在线 '+onlineCount+' 个</div></div>';
    h += '<div class="kpi"><div class="kl">总下泄流量</div><div class="kv">'+totalFlow.toFixed(2)+'</div><div class="ks">m³/s</div></div>';
    h += '<div class="kpi"><div class="kl">24h流量数据点</div><div class="kv">'+(ef24h.x||[]).length+'</div><div class="ks">小时级采样</div></div>';
    h += '</div>';

    h += '<div class="card"><div class="card-header"><span class="ct">生态流量监测明细</span><span class="cn">'+efRecords.length+' 个站点</span></div>';
    h += '<div class="card-body"><table class="tbl"><thead><tr><th>电站名称</th><th>生态流量1</th><th>生态流量2</th><th>合计流量</th><th>设备状态</th><th>通讯状态</th><th>设备数</th></tr></thead><tbody>';
    efRecords.forEach(r => {
      const ef1 = r.ecologicalFlow1 != null ? parseFloat(r.ecologicalFlow1).toFixed(3) : '-';
      const ef2 = r.ecologicalFlow2 != null ? parseFloat(r.ecologicalFlow2).toFixed(3) : '-';
      const efs = r.ecologicalFlowSum != null ? parseFloat(r.ecologicalFlowSum).toFixed(3) : '-';
      const status = r.passStat == 1 ? 'end' : 'progress';
      h += '<tr><td>'+esc(r.companyName||'-')+'</td><td style="font-family:var(--fd)">'+ef1+'</td><td style="font-family:var(--fd)">'+ef2+'</td><td style="font-family:var(--fd);color:var(--accent2);font-weight:600">'+efs+'</td><td>'+statusBadge(status)+'</td><td>'+esc(r.tcpStatStr||r.deviceStatStr||'-')+'</td><td>'+esc(r.deviceNum||'-')+'</td></tr>';
    });
    h += '</tbody></table></div></div>';

    if (ef24h.x && ef24h.x.length > 0) {
      h += '<div class="card" style="margin-top:14px"><div class="card-header"><span class="ct">24小时下泄流量曲线</span><span class="cn">'+ef24h.x.length+' 个数据点</span></div>';
      h += '<div class="card-body" style="max-height:200px;overflow:auto"><table class="tbl"><thead><tr><th>时间</th>';
      ef24h.x.slice(0, 24).forEach(t => { h += '<th>'+esc(String(t))+'</th>'; });
      h += '</tr></thead><tbody><tr><td style="font-weight:600">流量(m³/s)</td>';
      (ef24h.y||[]).slice(0, 24).forEach(v => { h += '<td style="font-family:var(--fd)">'+(v!=null?parseFloat(v).toFixed(2):'-')+'</td>'; });
      h += '</tr></tbody></table></div></div>';
    }
    break;
  }

  default:
    h += '<div class="empty-state"><div class="eicon">📄</div><div>页面开发中...</div><div style="font-size:10px;color:var(--t3);margin-top:4px">基于湖南小水电集控概要设计 v1.17</div></div>';
  }

  document.getElementById('contentRoot').innerHTML = h;
  if (pageId === 'monitorHome') {
    // Default: select root group level (湖南水电集控中心)
    setTimeout(function(){
      _treeActiveCenter = null;
      _treeSelectedStation = null;
      var d = window._MONITOR_DATA || {};
      var rootName = d.rootName || '小水电集控中心';
      var txt = document.getElementById('orgCascaderText');
      if (txt) { txt.textContent = rootName; txt.classList.remove('placeholder'); }
      selectTreeGroup();
    }, 50);
  }
  if (pageId === 'hydroMain') {
    setTimeout(function(){
      if (typeof renderUnitControl === 'function') {
        renderUnitControl();
      }
    }, 250);
  }
  if (pageId === 'smartPower') {
    setTimeout(function(){
      if (typeof renderUnitControl === 'function') {
        renderUnitControl();
      }
    }, 250);
  }
}

// ===== 定期工作 Tab 切换 =====
function switchIWTab(idx, el) {
  var tabs = document.querySelectorAll('.iw-tab');
  for (var i = 0; i < tabs.length; i++) { tabs[i].classList.toggle('active', i === idx); }
  var panels = document.querySelectorAll('.iw-panel');
  for (var j = 0; j < panels.length; j++) {
    panels[j].style.display = (j === idx) ? 'block' : 'none';
    if (j === idx) panels[j].classList.remove('hidden');
    else panels[j].classList.add('hidden');
  }
}
function switchIssTab(idx, el) {
  var tabs = document.querySelectorAll('.iw-tab');
  for (var i = 0; i < tabs.length; i++) { tabs[i].classList.toggle('active', i === idx); }
  var panels = document.querySelectorAll('#issPanel0, #issPanel1');
  for (var j = 0; j < panels.length; j++) {
    panels[j].style.display = (j === idx) ? 'block' : 'none';
    if (j === idx) panels[j].classList.remove('hidden');
    else panels[j].classList.add('hidden');
  }
}
function switchWbTab(idx, el) {
  var tabs = document.querySelectorAll('.iw-tab');
  for (var i = 0; i < tabs.length; i++) { tabs[i].classList.toggle('active', i === idx); }
  for (var j = 0; j < 4; j++) {
    var p = document.getElementById('wbPanel'+j);
    if (p) {
      p.style.display = (j === idx) ? 'block' : 'none';
      if (j === idx) p.classList.remove('hidden');
      else p.classList.add('hidden');
    }
  }
}
function switchIWRdo(el, groupId) {
  var group = document.getElementById(groupId);
  if (group) {
    var rdos = group.querySelectorAll('.iw-rdo');
    for (var i = 0; i < rdos.length; i++) { rdos[i].classList.remove('active'); }
  }
  el.classList.add('active');
  el.querySelector('input').checked = true;
}

renderSidebar();
renderPage('monitorHome');
updateClock();
setInterval(updateClock, 1000);
setInterval(refreshScadaValues, 2000);
</script>
